# GitHub Actions workflow: build and publish a Release on tag push.
#
# Trigger: push a tag matching `v*` (e.g. v0.0.7) to the remote.
# The workflow:
#   1. Checks out the repo at the tag.
#   2. Runs scripts/pack.sh to build tar.gz + zip archives.
#   3. Creates a GitHub Release (if it doesn't exist) and uploads both archives.
#
# The tag name (e.g. v0.0.7) does NOT need to match install/version.json —
# but it SHOULD, to keep the release artifact filename consistent. The pack
# script reads install/version.json for the archive filename and manifest.
#
# To release:
#   1. Bump install/version.json (e.g. 0.0.7)
#   2. Commit and push
#   3. git tag v0.0.7 && git push origin v0.0.7
#   4. The workflow does the rest automatically.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Allow manual trigger for testing without a tag
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build archives without creating a release'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          # version.json is authoritative; legacy install/VERSION as fallback.
          VER="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' install/version.json | head -n 1 | tr -d ' \r')"
          if [[ -z "$VER" && -f install/VERSION ]]; then
            VER="$(head -1 install/VERSION | tr -d '\r\n ')"
          fi
          if [[ -z "$VER" ]]; then
            echo "::error::could not determine version from install/version.json"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME:-manual}" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Build archives
        run: |
          chmod +x scripts/pack.sh scripts/verify.sh
          ./scripts/pack.sh --out dist
          echo "--- Archives built ---"
          ls -lh dist/

      - name: Verify archive completeness & SHA-256 integrity (Hard Gate)
        run: |
          ./scripts/verify.sh dist

      - name: Create latest aliases
        run: |
          VER="${{ steps.version.outputs.version }}"
          cp "dist/opencode-prime-${VER}.tar.gz" "dist/opencode-prime-latest.tar.gz"
          cp "dist/opencode-prime-${VER}.zip" "dist/opencode-prime-latest.zip"
          echo "--- Aliases created ---"
          ls -lh dist/*latest*

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Build a simple changelog from commits since the last tag
          if [[ "$TAG" == "manual" ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          else
            PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p' || echo "")
          fi
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD 2>/dev/null || echo "")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" -20 2>/dev/null || echo "")
          fi

          {
            echo '# OpenCode Prime (OCP)'
            echo ''
            echo '## What'\''s included'
            echo ''
            echo '- **Platform**: Windows (PowerShell) / macOS / Linux / WSL (Bash)'
            echo '- **Archives**: `opencode-prime-<version>.tar.gz` (Unix) + `opencode-prime-<version>.zip` (Windows) + `latest` aliases'
            echo '- **Files**: manifest-listed runtime files + install scripts + bin dispatchers (opencode-prime, ocp)'
            echo ''
            echo '## Install & Quick Start'
            echo ''
            echo 'See documentation: [https://kenlin8827.github.io/opencode-prime/](https://kenlin8827.github.io/opencode-prime/)'
            echo ''
            echo '## Changes'
            echo ''
            echo "${COMMITS}"
            echo ''
            echo 'See [install/README.md](https://github.com/kenlin8827/opencode-prime/blob/main/install/README.md) for installer internals.'
          } > dist/RELEASE_NOTES.md
          echo "notes_path=dist/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenCode Prime v${{ steps.version.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/opencode-prime-${{ steps.version.outputs.version }}.tar.gz
            dist/opencode-prime-${{ steps.version.outputs.version }}.zip
            dist/opencode-prime-latest.tar.gz
            dist/opencode-prime-latest.zip
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Upload artifacts (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: opencode-prime-${{ steps.version.outputs.version }}-archives
          path: dist/*.*
          retention-days: 7
