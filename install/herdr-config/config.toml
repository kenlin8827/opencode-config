# herdr config.toml — OpenCode Prime defaults
# Copy to ~/.config/herdr/config.toml to use.
# Run `ocp herdr-config install` to deploy non-destructively.

[theme]
name = "catppuccin"

[update]
channel = "stable"
version_check = true
manifest_check = true

[terminal]
default_shell = ""
shell_mode = "auto"
new_cwd = "follow"

[ui]
sidebar_width = 30
sidebar_min_width = 20
sidebar_max_width = 40
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"

pane_borders = true
pane_outer_borders = true
pane_scrollbars = true
pane_gaps = true

window_title = "{workspace} · herdr"
host_cursor = "native"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
status_indicators = "dots"

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent", "tab"],
  ["workspace"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 2
herdr.position = "bottom-right"
clipboard.enabled = true
clipboard.position = "bottom-center"

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[worktrees]
directory = "~/.herdr/worktrees"

[advanced]
scrollback_limit_bytes = 10000000

[experimental]
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["opencode"]
